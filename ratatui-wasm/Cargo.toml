[package]
name = "ratatui-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Capability-based WebAssembly plugin host for Ratatui widgets"
keywords = ["ratatui", "tui", "wasm", "plugin", "terminal"]
categories = ["command-line-interface"]

[dependencies]
ratatui-core = { workspace = true }
anyhow = "1"
pkg-config = "0.3.27"
thiserror = "1.0.50"
wasmtime = { version = "47.0.3", features = ["component-model"] }
wasmtime-wasi = "47.0.3"
serde = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
clap = { workspace = true, optional = true }

[features]
default = []
cli = ["dep:clap"]

[[bin]]
name = "ratatui-wasm"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.cargo-udeps.ignore]
normal = ["pkg-config", "thiserror"]

[lints]
workspace = true
